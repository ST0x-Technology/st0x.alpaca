name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - "graphite-base/**"

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            command: cargo check --locked --no-default-features

          - name: issuer
            command: cargo check --locked --no-default-features --features issuer

          - name: broker
            command: cargo check --locked --no-default-features --features broker

          - name: wallet
            command: cargo check --locked --no-default-features --features wallet

          - name: market-data
            command: cargo check --locked --no-default-features --features market-data

          - name: test
            command: cargo test --locked --all-features

          - name: clippy
            command: cargo clippy --locked --all-targets --all-features -- -D warnings

          - name: fmt
            command: cargo fmt --all -- --check

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: DeterminateSystems/nix-installer-action@b6e4494ddccc51b56de1189099089a3514a69245
        with:
          extra-conf: |
            accept-flake-config = true
            fallback = true

      - uses: DeterminateSystems/magic-nix-cache-action@5626df0a8b8f16cb060538f6d3041500a2d10cb0
      - name: ${{ matrix.name }}
        run: nix develop -c ${{ matrix.command }}
