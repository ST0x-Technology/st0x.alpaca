[package]
name = "st0x-alpaca"
version = "0.1.0"
edition = "2024"
description = "Shared Alpaca client library for st0x services"
license = "LicenseRef-Proprietary"
publish = false

[features]
default = []
# ITN issuer-callback surface: mint callback, redeem initiation, request
# polling (st0x.issuance).
issuer = [
  "dep:alloy-primitives",
  "dep:async-trait",
  "dep:chrono",
  "dep:rust_decimal",
  "dep:st0x-finance",
  "dep:uuid",
]
# Broker API trading surface: orders, positions, journals, account, clock
# (st0x.liquidity).
broker = [
  "dep:chrono",
  "dep:chrono-tz",
  "dep:rust_decimal",
  "dep:st0x-finance",
  "dep:tokio",
  "dep:url",
  "dep:uuid",
]
# Crypto wallet surface: funding wallets, transfers, whitelists
# (st0x.liquidity).
wallet = [
  "dep:alloy-primitives",
  "dep:chrono",
  "dep:st0x-finance",
  "dep:tokio",
  "dep:uuid",
]
# Market data surface: quotes/snapshots (st0x.liquidity).
market-data = ["dep:st0x-finance"]

[dependencies]
alloy-primitives = { version = "1", features = ["serde"], optional = true }
async-trait = { version = "0.1", optional = true }
backon = "1"
chrono = { version = "0.4", features = ["serde"], optional = true }
chrono-tz = { version = "0.10", optional = true }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
rust_decimal = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
st0x-finance = { git = "https://github.com/ST0x-Technology/st0x.finance", rev = "819b6f6bd04c9dcd0f9c0cdded0a07038cd06139", version = "0.1.0", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["time"], optional = true }
url = { version = "2", features = ["serde"], optional = true }
uuid = { version = "1", features = ["serde", "v4"], optional = true }

[dev-dependencies]
httpmock = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
